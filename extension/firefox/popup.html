<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dual Pi-hole Control</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="header-title">
      <img src="icon.svg" alt="" class="logo" />
      <h1>Dual Pi-hole Control</h1>
    </div>
    <span class="version">v0.4.0</span>
  </header>

  <!-- Per-server status -->
  <section id="statusSection">
    <div class="status-list" id="statusList">
      <div class="status-row muted">Loading status&hellip;</div>
    </div>
    <div class="last-updated" id="lastUpdated"></div>
  </section>

  <!-- Action message (success / partial failure / error) -->
  <div id="message" class="message hidden"></div>

  <!-- Control buttons -->
  <section class="controls">
    <div class="btn-grid">
      <button class="btn disable" data-seconds="30">Disable 30s</button>
      <button class="btn disable" data-seconds="300">Disable 5m</button>
      <button class="btn disable" data-seconds="600">Disable 10m</button>
      <button class="btn disable" data-seconds="1800">Disable 30m</button>
    </div>
    <button class="btn enable" id="enableBtn">Enable Now</button>
    <button class="btn refresh" id="refreshBtn">Refresh Status</button>
  </section>

  <!-- Settings (collapsible) -->
  <section class="settings">
    <button class="settings-toggle" id="settingsToggle">Settings &#9662;</button>
    <div class="settings-body hidden" id="settingsBody">

      <label>Connection mode</label>
      <div class="mode-row">
        <label class="mode-option">
          <input type="radio" name="mode" value="direct" id="modeDirect" />
          Direct
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="backend" id="modeBackend" />
          Backend service
        </label>
      </div>

      <!-- Direct mode: manage Pi-holes right here -->
      <div id="directSettings">
        <div id="piholeList"></div>
        <button class="btn ghost full" id="addPiholeBtn" type="button">+ Add Pi-hole</button>
        <p class="hint">
          Tip: create an <strong>app password</strong> in Pi-hole
          (Settings &rarr; Web Interface / API) instead of using your admin
          password. Direct mode requires Pi-hole v6.
        </p>
      </div>

      <!-- Backend mode: the companion backend service -->
      <div id="backendSettings" class="hidden">
        <label for="backendUrl">Backend URL</label>
        <input type="text" id="backendUrl" placeholder="http://192.168.1.50:8088"
               autocomplete="off" spellcheck="false" />

        <label for="controlToken">Control Token</label>
        <div class="token-row">
          <input type="password" id="controlToken" placeholder="CONTROL_TOKEN"
                 autocomplete="off" spellcheck="false" />
          <button class="btn ghost" id="tokenVisibilityBtn" type="button">Show</button>
        </div>
      </div>

      <button class="btn save" id="saveSettingsBtn">Save Settings</button>
    </div>
  </section>

  <!-- Support link -->
  <footer>
    <a href="https://buymeacoffee.com/howarthtech" id="supportLink">
      &#127829; Enjoying this? Buy me a slice
    </a>
  </footer>

  <script src="browserApi.js"></script>
  <script src="piholeDirect.js"></script>
  <script src="popup.js"></script>
</body>
</html>
